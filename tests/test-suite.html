<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MT1399 牌路辨識測試集 v1.9.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f23; color: #e0e0e0; padding: 20px; }
  h1 { font-size: 20px; margin-bottom: 8px; color: #fff; }
  .subtitle { font-size: 13px; color: #888; margin-bottom: 24px; }
  .test-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .test-card { background: #1a1a2e; border-radius: 12px; padding: 16px; border: 1px solid #2a2a4a; }
  .test-card h3 { font-size: 14px; margin-bottom: 8px; color: #c9b8ff; }
  .test-card .meta { font-size: 12px; color: #888; margin-bottom: 12px; }
  .test-card .image-slot { width: 100%; height: 160px; background: #0f0f23; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #666; font-size: 12px; margin-bottom: 12px; overflow: hidden; }
  .test-card .image-slot img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .test-card .expected { font-size: 12px; color: #7ec8a0; margin-bottom: 8px; }
  .test-card .result { font-size: 12px; padding: 8px; background: #0f0f23; border-radius: 6px; min-height: 60px; white-space: pre-wrap; }
  .test-card .pass { color: #7ec8a0; }
  .test-card .fail { color: #e07070; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 4px; }
  .tag.positive { background: #1a3a2a; color: #7ec8a0; }
  .tag.negative { background: #3a1a1a; color: #e07070; }
  .tag.edge { background: #3a3a1a; color: #c8c87e; }
  .tag.platform { background: #1a2a3a; color: #7ea0c8; }
  .upload-area { border: 2px dashed #3a3a5a; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 24px; cursor: pointer; }
  .upload-area:hover { border-color: #6a5acd; }
  .upload-area input { display: none; }
  .summary { background: #1a1a2e; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
  .summary table { width: 100%; font-size: 13px; border-collapse: collapse; }
  .summary th, .summary td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #2a2a4a; }
  .summary th { color: #c9b8ff; font-weight: 600; }
</style>
</head>
<body>
<h1>MT1399 牌路辨識測試集</h1>
<p class="subtitle">版本 v1.9.0 | 測試項目：15 項 | 請上傳各場景截圖進行驗證</p>

<div class="summary">
  <table>
    <tr><th>測試類別</th><th>數量</th><th>說明</th></tr>
    <tr><td>正例測試</td><td>2</td><td>清晰手機/電腦截圖，應成功辨識</td></tr>
    <tr><td>邊界測試</td><td>4</td><td>縮放、黑邊、留白，測試魯棒性</td></tr>
    <tr><td>負例測試</td><td>3</td><td>模糊、不完整、非牌路，應失敗且不扣局</td></tr>
    <tr><td>平台測試</td><td>6</td><td>MT/DG/T9/歐博/W/SA 真人牌路</td></tr>
  </table>
</div>

<div class="upload-area" onclick="document.getElementById('testInput').click()">
  <input type="file" id="testInput" accept="image/*" multiple onchange="handleFiles(this.files)">
  <p>點擊上傳測試截圖（可多選）</p>
  <p style="font-size: 12px; color: #666;">支援 PNG、JPG、JPEG</p>
</div>

<div class="test-grid" id="testGrid"></div>

<script>
const TEST_CASES = [
  { id: 1, name: "清晰手機截圖", type: "positive", expected: "成功辨識，markerCount ≥ 6", platform: "通用" },
  { id: 2, name: "清晰電腦截圖", type: "positive", expected: "成功辨識，markerCount ≥ 6", platform: "通用" },
  { id: 3, name: "縮放圖片 50%", type: "edge", expected: "可能成功，confidence ≥ 0.45", platform: "通用" },
  { id: 4, name: "縮放圖片 200%", type: "edge", expected: "可能成功，confidence ≥ 0.45", platform: "通用" },
  { id: 5, name: "黑邊圖片", type: "edge", expected: "應成功，region 正確定位", platform: "通用" },
  { id: 6, name: "留白過多", type: "edge", expected: "可能失敗，markerCount < 6", platform: "通用" },
  { id: 7, name: "模糊截圖", type: "negative", expected: "失敗，不扣局", platform: "通用" },
  { id: 8, name: "不完整截圖", type: "negative", expected: "失敗，不扣局", platform: "通用" },
  { id: 9, name: "非牌路圖片", type: "negative", expected: "失敗，不扣局", platform: "N/A" },
  { id: 10, name: "MT 真人牌路", type: "platform", expected: "成功辨識", platform: "MT" },
  { id: 11, name: "DG 真人牌路", type: "platform", expected: "成功辨識", platform: "DG" },
  { id: 12, name: "T9 真人牌路", type: "platform", expected: "成功辨識", platform: "T9" },
  { id: 13, name: "歐博真人牌路", type: "platform", expected: "成功辨識", platform: "歐博" },
  { id: 14, name: "W 真人牌路", type: "platform", expected: "成功辨識", platform: "W" },
  { id: 15, name: "SA 真人牌路", type: "platform", expected: "成功辨識", platform: "SA" },
];

function renderTestCases() {
  const grid = document.getElementById('testGrid');
  grid.innerHTML = TEST_CASES.map(tc => `
    <div class="test-card" data-id="${tc.id}">
      <h3>#${tc.id.toString().padStart(2, '0')} ${tc.name}</h3>
      <div class="meta">
        <span class="tag ${tc.type}">${tc.type === 'positive' ? '正例' : tc.type === 'negative' ? '負例' : tc.type === 'edge' ? '邊界' : '平台'}</span>
        <span>${tc.platform}</span>
      </div>
      <div class="image-slot" id="slot-${tc.id}">
        等待上傳截圖...
      </div>
      <div class="expected">預期：${tc.expected}</div>
      <div class="result" id="result-${tc.id}">尚未測試</div>
    </div>
  `).join('');
}

function handleFiles(files) {
  Array.from(files).forEach((file, index) => {
    const tc = TEST_CASES[index];
    if (!tc) return;
    
    const slot = document.getElementById(`slot-${tc.id}`);
    const result = document.getElementById(`result-${tc.id}`);
    
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    slot.innerHTML = '';
    slot.appendChild(img);
    
    result.textContent = `已上傳：${file.name}\n大小：${(file.size / 1024).toFixed(1)} KB\n類型：${file.type}`;
  });
}

renderTestCases();
</script>
</body>
</html>
